[package]
name = "huskarl-apple"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "macOS/iOS Keychain secrets and Secure Enclave cryptography for the huskarl ecosystem."
repository = "https://github.com/huskarl-rs/huskarl-apple"
license = "MIT OR Apache-2.0"
keywords = ["authentication", "apple", "ios", "macos", "keychain"]
categories = ["authentication"]
readme = "README.md"

[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
]

[dependencies]
blocking = "1"
bon = "3"
core-foundation = "0.10"
zeroize = "1"
huskarl-core = { version = "0.10", default-features = false }
huskarl = { version = "0.11", default-features = false }
serde_json = "1"
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
security-framework = { version = "3", features = ["OSX_10_15"] }
security-framework-sys = "2"
snafu = { version = "0.9", default-features = false, features = ["std", "rust_1_81"] }

[dev-dependencies]
http = "1"
huskarl-reqwest = { version = "0.9", features = ["rustls-tls"] }
huskarl-crypto-native = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[[example]]
name = "cleanup-test-keys"
path = "support/cleanup_test_keys.rs"
