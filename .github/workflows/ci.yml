name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      matrix:
        rust: ["1.92.0", stable]
        features:
          - name: default
            args: ""
          - name: urlsession
            args: "--features urlsession"
          - name: web-authentication
            args: "--features web-authentication"
          - name: local-authentication
            args: "--features local-authentication"
          - name: all
            args: "--all-features"
    name: Rust ${{ matrix.rust }} / ${{ matrix.features.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "${{ matrix.rust }}" --profile minimal --component rustfmt --component clippy
      - name: Test
        run: cargo +${{ matrix.rust }} test --locked --all-targets ${{ matrix.features.args }}
      - name: Test documentation
        run: cargo +${{ matrix.rust }} test --locked --doc ${{ matrix.features.args }}
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +${{ matrix.rust }} doc --locked --no-deps ${{ matrix.features.args }}
      - name: Check formatting
        if: matrix.rust == 'stable' && matrix.features.name == 'default'
        run: cargo +stable fmt --check
      - name: Clippy
        if: matrix.rust == 'stable'
        run: cargo +stable clippy --locked --all-targets ${{ matrix.features.args }} -- -D warnings
      - name: Check iOS library builds
        if: matrix.rust == 'stable'
        run: |
          rustup target add --toolchain stable aarch64-apple-ios aarch64-apple-ios-sim
          cargo +stable check --locked --lib --target aarch64-apple-ios ${{ matrix.features.args }}
          cargo +stable check --locked --lib --target aarch64-apple-ios-sim ${{ matrix.features.args }}
      - name: Check native session example on MSRV
        if: matrix.rust == '1.92.0' && matrix.features.name == 'all'
        run: cargo +${{ matrix.rust }} check --locked --manifest-path examples/native-session/rust/Cargo.toml --all-targets
      - name: Test and build native session example
        if: matrix.rust == 'stable' && matrix.features.name == 'all'
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          cargo +stable fmt --manifest-path examples/native-session/rust/Cargo.toml --check
          cargo +stable test --locked --manifest-path examples/native-session/rust/Cargo.toml
          cargo +stable clippy --locked --manifest-path examples/native-session/rust/Cargo.toml --all-targets -- -D warnings
          python3 scripts/native-session.py --build-only --unsigned
