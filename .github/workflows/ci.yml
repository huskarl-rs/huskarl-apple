name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      matrix:
        rust: ["1.92.0", stable]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "${{ matrix.rust }}" --profile minimal --component rustfmt --component clippy
      - name: Test
        run: cargo +${{ matrix.rust }} test --locked --all-targets
      - name: Test documentation
        run: cargo +${{ matrix.rust }} test --locked --doc
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +${{ matrix.rust }} doc --locked --no-deps
      - name: Check formatting
        if: matrix.rust == 'stable'
        run: cargo +stable fmt --check
      - name: Clippy
        if: matrix.rust == 'stable'
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Check iOS library builds
        if: matrix.rust == 'stable'
        run: |
          rustup target add --toolchain stable aarch64-apple-ios aarch64-apple-ios-sim
          cargo +stable check --locked --lib --target aarch64-apple-ios
          cargo +stable check --locked --lib --target aarch64-apple-ios-sim
